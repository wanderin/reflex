[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = "allow"

# Force proc-macro2 span-locations feature for anchor-syn IDL build
[workspace.dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }

# Patch anchor-syn for lints config
[patch.crates-io]
anchor-syn = { path = "vendor/anchor-syn" }

